[project]
name = "deepest-debug-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "N"]
# `import torch.nn.functional as F` is the universal PyTorch idiom.
ignore = ["N812"]
